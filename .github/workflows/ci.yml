name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA development library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Install Rust (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check toolchain pins
        run: make check-toolchain

      - name: Check formatting, clippy, and Omarchy plugin safety
        run: make lint

      - name: Run unit and integration tests
        run: make test

      - name: Build release binary
        run: make build

      - name: Test staged standalone install and uninstall
        run: |
          STAGE="$(mktemp -d)"
          XDG_CONFIG_HOME="$STAGE/config" make PREFIX="$STAGE" install
          test -x "$STAGE/bin/scarlett-tui"
          grep -q "Terminal=true" "$STAGE/share/applications/Scarlett TUI.desktop"
          XDG_CONFIG_HOME="$STAGE/config" make PREFIX="$STAGE" uninstall
          test ! -e "$STAGE/bin/scarlett-tui"
          rm -rf "$STAGE"
